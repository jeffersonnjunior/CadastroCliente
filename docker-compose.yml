services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: credito-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: credito
      RABBITMQ_DEFAULT_PASS: credito123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: credito-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Password123"
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_Password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credito-cadastro-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=sqlserver,1433;Database=CadastroCliente;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;Encrypt=False
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__UserName: credito
      RabbitMq__Password: credito123
      RabbitMq__Exchange: credito.clientes
      RabbitMq__RoutingKey: cliente.cadastrado
      RabbitMq__Enabled: "true"
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
